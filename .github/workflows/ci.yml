name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Generated release PRs have already consumed their changesets.
      - if: github.head_ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository
        run: npm run changeset -- status --since origin/main

  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --locked --all-targets
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: python3 tests/terminal_smoke.py target/release/pace
