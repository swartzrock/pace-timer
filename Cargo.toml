[package]
name = "pace"
version = "0.3.0"
edition = "2024"
description = "A visual terminal countdown timer, ported from pace-ts"
license = "ISC"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
figlet-rs = "0.1.5"
rand = "0.9"

[profile.release]
lto = "thin"
strip = true

